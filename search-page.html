<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="search.css">
    <script src="search-page.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
</head>

<body>
    <div class="search-page-inner">
        <div class="desktop-search">
            <div class="search-top-row">
                <a href="#" class="search-back-btn" onclick="history.back(); return false;">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <h1 class="search-page-title">Search</h1>
            </div>


            <!-- Search Bar -->
            <div class="search-main-bar">
                <span class="material-symbols-outlined search-icon">search</span>

                <input type="text" id="searchInputPage" placeholder="Search for cupcakes, cakes..">

                <button class="mic-btn interactive-btn" type="button" id="micButton">
                    <span class="material-symbols-outlined">mic</span>
                </button>
            </div>
        </div>


        <!-- Ask AI -->
        <a href="AIpage.html" class="ask-ai-card interactive-btn" id="askAiCard">
            <div class="ask-ai-left">
                <p class="ask-ai-label">
                    <span class="material-symbols-outlined ask-ai-stars">auto_awesome</span>
                    ASK AI
                </p>

                <h2>Help me choose a cake</h2>
                <p class="ask-ai-desc">
                    Answer a few questions to find the perfect match.
                </p>
            </div>

            <div class="ask-ai-arrow-wrap">
                <span class="material-symbols-outlined">arrow_forward</span>
            </div>
        </a>

        <!-- Popular Searches -->
        <div class="search-block">
            <h2 class="search-block-title">Popular Searches</h2>

            <div class="popular-search-grid">
                <button class="search-pill interactive-btn" type="button">chocolate cake</button>
                <button class="search-pill interactive-btn" type="button">vanilla cake</button>
                <button class="search-pill interactive-btn" type="button">kids cake</button>
                <button class="search-pill interactive-btn" type="button">red velvet</button>
                <button class="search-pill interactive-btn" type="button">wedding tier</button>
                <button class="search-pill interactive-btn" type="button">vegan cupcakes</button>
            </div>
        </div>

        <!-- Recent Searches -->

        <div class="recent-top">
            <h2 class="search-block-title">Recent Searches</h2>

            <button class="clear-all-btn" type="button" id="clearAllRecent">
                Clear all
            </button>
        </div>

        <div class="recent-search-list" id="recentSearchList">
            <button class="recent-search-item interactive-btn" type="button">
                <span class="material-symbols-outlined">history</span>
                <span>Chocolate cake</span>
                <span class="material-symbols-outlined close">close</span>
            </button>

            <button class="recent-search-item interactive-btn" type="button">
                <span class="material-symbols-outlined">history</span>
                <span>Mint Cake</span>
                <span class="material-symbols-outlined close">close</span>
            </button>

            <button class="recent-search-item interactive-btn" type="button">
                <span class="material-symbols-outlined">history</span>
                <span>Gluten free options</span>
                <span class="material-symbols-outlined close">close</span>
            </button>
        </div>
    </div>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom_bar">
        <a href="homepage.html" class="bottom-bar-item interactive-bar">
            <span class="material-symbols-outlined">home</span>
            <p>HOME</p>
        </a>

        <a href="fav-page.html" class="bottom-bar-item interactive-bar">
            <span class="material-symbols-outlined">favorite</span>
            <p>FAVORITE</p>
        </a>


        <a href="productlist.html" class="bottom-bar-item interactive-bar">
            <span class="material-symbols-outlined">storefront</span>
            <p>BAKERY</p>
        </a>

        <a href="cartpage.html" class="bottom-bar-item interactive-bar">
            <span class="material-symbols-outlined">shopping_bag</span>
            <p>CART</p>
        </a>

        <a href="pro-page.html" class="bottom-bar-item interactive-bar">
            <span class="material-symbols-outlined">person</span>
            <p>PROFILE</p>
        </a>
    </nav>


</body>

</html>
